<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: #0f0f0f; color: #fff; padding: 16px; margin: 0; box-sizing: border-box; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { font-size: 15px; font-weight: 700; color: #10b981; display: flex; align-items: center; gap: 6px; }
    .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .label { font-size: 10px; text-transform: uppercase; color: #888; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
    .val { font-size: 12px; color: #eee; font-weight: 500; line-height: 1.4; }
    .stat-row { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid #282828; font-size: 11px; color: #aaa; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🙡 LiveTruth Shield</div>
    <div class="pulse-dot"></div>
  </div>
  <div class="card">
    <div class="label">System Status</div>
    <div class="val" style="color:#34d399; font-weight:600;">● Actively Scanning YouTube</div>
    <div class="stat-row">
      <span>Engine</span>
      <strong style="color:#fff;">Gemma + Gemini Search</strong>
    </div>
  </div>
  <div class="card">
    <div class="label">⚡ Instant Video Intel</div>
    <div class="val">Open any video on YouTube to view live fact-checks, sources, and background context.</div>
  </div>
  <p style="font-size:10px; color:#777; text-align:center; margin:10px 0 0;">Click the on-screen 🙩! button at bottom-right of YouTube to view the live HUD!</p>
</body>
</html>
